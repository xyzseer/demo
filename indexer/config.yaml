# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
# Generated by scripts/build-config.mjs — do not edit by hand; run: node scripts/build-config.mjs > config.yaml
name: seer-pm-indexer
description: Seer PM markets indexer (HyperIndex)
unordered_multichain_mode: true
preload_handlers: false
address_format: lowercase

contracts:
  - name: MarketFactory
    abi_file_path: ./abis/MarketFactory.json
    handler: ./src/EventHandlers.ts
    events:
      - event: NewMarket(address indexed market, string marketName, address parentMarket, bytes32 conditionId, bytes32 questionId, bytes32[] questionsIds)
        field_selection:
          transaction_fields:
            - hash
            - from
  - name: FutarchyFactory
    abi_file_path: ./abis/FutarchyFactory.json
    handler: ./src/EventHandlers.ts
    events:
      - event: NewProposal(address indexed proposal, string marketName, bytes32 conditionId, bytes32 questionId)
        field_selection:
          transaction_fields:
            - hash
            - from
  - name: Reality
    abi_file_path: ./abis/Realitiy.json
    handler: ./src/EventHandlers.ts
    events:
      - event: LogNewAnswer(bytes32 answer, bytes32 indexed question_id, bytes32 history_hash, address indexed user, uint256 bond, uint256 ts, bool is_commitment)
      - event: LogFinalize(bytes32 indexed question_id, bytes32 indexed answer)
      - event: LogNotifyOfArbitrationRequest(bytes32 indexed question_id, address indexed requester)
      - event: LogReopenQuestion(bytes32 indexed question_id, bytes32 indexed reopened_question_id)
      - event: LogCancelArbitration(bytes32 indexed question_id)
  - name: ConditionalTokens
    abi_file_path: ./abis/ConditionalTokens.json
    handler: ./src/EventHandlers.ts
    events:
      - event: PositionSplit(address indexed stakeholder, address collateralToken, bytes32 indexed parentCollectionId, bytes32 indexed conditionId, uint256[] partition, uint256 amount)
        field_selection:
          transaction_fields:
            - hash
            - from
            - input
      - event: PositionsMerge(address indexed stakeholder, address collateralToken, bytes32 indexed parentCollectionId, bytes32 indexed conditionId, uint256[] partition, uint256 amount)
        field_selection:
          transaction_fields:
            - hash
            - from
            - input
      - event: PayoutRedemption(address indexed redeemer, address indexed collateralToken, bytes32 indexed parentCollectionId, bytes32 conditionId, uint256[] indexSets, uint256 payout)
        field_selection:
          transaction_fields:
            - hash
            - from
            - input
      - event: ConditionResolution(bytes32 indexed conditionId, address indexed oracle, bytes32 indexed questionId, uint256 outcomeSlotCount, uint256[] payoutNumerators)
  - name: CurateIEvidence
    abi_file_path: ./abis/IEvidence.json
    handler: ./src/EventHandlers.ts
    events:
      - event: MetaEvidence(uint256 indexed _metaEvidenceID, string _evidence)
  - name: ArbitratorIEvidence
    abi_file_path: ./abis/IEvidence.json
    handler: ./src/EventHandlers.ts
    events:
      - event: MetaEvidence(uint256 indexed _metaEvidenceID, string _evidence)

